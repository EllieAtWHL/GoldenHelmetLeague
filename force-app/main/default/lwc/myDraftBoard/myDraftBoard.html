<template>
  <lightning-card title="My Draft Board">
    <lightning-tabset variant="scoped">
      <lightning-tab label="Available Players">
        <div class="slds-p-around_small controls">
          <lightning-input
            type="search"
            label="Search players"
            variant="label-hidden"
            placeholder="Search by name..."
            onchange={handleSearchChange}
          ></lightning-input>
          <div class="slds-p-top_x-small position-pills">
            <template for:each={positionPills} for:item="pill">
              <lightning-button
                key={pill.position}
                label={pill.position}
                variant={pill.variant}
                data-position={pill.position}
                onclick={handlePositionFilter}
                class="slds-p-right_xx-small"
              ></lightning-button>
            </template>
          </div>
        </div>

        <template for:each={groupedUndrafted} for:item="group">
          <div key={group.position} class="position-group">
            <h2 class="slds-text-heading_small position-heading">
              {group.position}
            </h2>
            <lightning-accordion
              allow-multiple-sections-open
              active-section-name={group.activeSections}
            >
              <template for:each={group.tiers} for:item="tier">
                <lightning-accordion-section
                  key={tier.key}
                  name={tier.key}
                  label={tier.label}
                >
                  <template for:each={tier.players} for:item="player">
                    <c-my-draft-board-player-card
                      key={player.Id}
                      player={player}
                      value-label={player.valueLabel}
                      onnotessave={handleNotesSave}
                    ></c-my-draft-board-player-card>
                  </template>
                </lightning-accordion-section>
              </template>
            </lightning-accordion>
          </div>
        </template>
      </lightning-tab>

      <lightning-tab label="My Team">
        <template for:each={groupedMyTeam} for:item="group">
          <div key={group.position} class="position-group">
            <h2 class="slds-text-heading_small position-heading">
              {group.position}
            </h2>
            <template for:each={group.players} for:item="player">
              <c-my-draft-board-player-card
                key={player.Id}
                player={player}
                onnotessave={handleNotesSave}
              ></c-my-draft-board-player-card>
            </template>
          </div>
        </template>
      </lightning-tab>
    </lightning-tabset>
  </lightning-card>

  <template lwc:if={showNominationModal}>
    <section class="nomination-overlay">
      <div class="nomination-card">
        <lightning-button-icon
          icon-name="utility:close"
          alternative-text="Close"
          class="close-button"
          onclick={handleCloseNomination}
        ></lightning-button-icon>
        <h2 class="slds-text-heading_medium slds-p-bottom_x-small">
          Now Nominated
        </h2>
        <c-my-draft-board-player-card
          player={nominatedPlayer}
          value-label={nominatedPlayer.valueLabel}
          onnotessave={handleNotesSave}
        ></c-my-draft-board-player-card>
      </div>
    </section>
  </template>
</template>
